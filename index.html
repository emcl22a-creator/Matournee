<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --bg:#000000; --panel:#FFF; --ink:#1C1C1E; --ink-2:#3A3A3C; --muted:#8E8E93;
    --hair:rgba(60,60,67,0.12); --blue:#007AFF; --green:#34C759; --purple:#5856D6;
    --dark:#1C1C1E; --dark-2:#2C2C2E;
    --rxl:30px; --rl:20px; --rm:14px; --rs:11px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  /* ===== page principale scrollable (style maquette) ===== */
  #app{ max-width:430px; margin:0 auto; height:100dvh; display:flex; flex-direction:column;
        padding:env(safe-area-inset-top) 0 0; position:relative; background:#000; }

  /* barre haut : menu / nom / cloche */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:12px 20px 8px; }
  .topbar .brand{ display:flex; align-items:center; gap:6px; }
  .topbar .brand img{ width:26px; height:26px; object-fit:contain; }
  .topbar .brand span{ font-size:20px; font-weight:700; color:#fff; letter-spacing:-0.3px; }
  .circle-btn{ width:40px; height:40px; border-radius:50%; background:transparent;
    display:flex; align-items:center; justify-content:center; color:#fff; border:none; font-size:22px; }

  /* zone scrollable */
  .scroll{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 20px 0; }

  /* en-tête salutation + titre */
  .greeting{ color:var(--muted); font-size:15px; font-weight:400; margin:8px 0 2px; letter-spacing:-0.2px; }
  .page-title{ font-size:27px; line-height:1.1; font-weight:700; color:#fff; letter-spacing:-0.6px; margin:0 0 6px; white-space:nowrap; }
  .subtitle{ color:var(--muted); font-size:15px; font-weight:400; margin:0 0 18px; letter-spacing:-0.2px; }

  /* carte stats (Durée / Distance) */
  .statbar{ display:flex; gap:12px; background:rgba(255,255,255,0.06); backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%); border:1px solid rgba(255,255,255,0.12);
    border-radius:var(--rl); padding:16px; margin-bottom:14px; }
  .statbar .cell{ display:flex; align-items:center; gap:12px; flex:1; }
  .statbar .cell + .cell{ border-left:1px solid rgba(255,255,255,0.08); padding-left:14px; }
  .statbar .ico{ width:40px; height:40px; border-radius:11px; border:1px solid rgba(255,255,255,0.12);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px; flex:none; }
  .statbar .k{ color:var(--muted); font-size:13px; font-weight:400; letter-spacing:-0.1px; }
  .statbar .v{ color:#fff; font-size:19px; font-weight:600; letter-spacing:-0.3px; line-height:1.1; }

  /* carte (mini) */
  .mapcard{ position:relative; height:280px; border-radius:var(--rl); overflow:hidden;
    background:#0E0E10; border:1px solid rgba(255,255,255,0.07); margin-bottom:16px; }
  #gmap{ position:absolute; inset:0; }
  #mapPlaceholder{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:8px; color:var(--muted); text-align:center; padding:24px; }
  .loc-btn{ position:absolute; left:14px; top:14px; width:42px; height:42px; border-radius:50%;
    background:rgba(255,255,255,0.1); backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%); border:1px solid rgba(255,255,255,0.18);
    color:#fff; font-size:18px; z-index:3; }

  /* liste d'arrêts façon maquette */
  .stoplist{ background:#121214; border:1px solid rgba(255,255,255,0.07); border-radius:var(--rl);
    overflow:hidden; margin-bottom:16px; }
  .stop{ display:flex; align-items:center; gap:14px; padding:15px 16px; }
  .stop + .stop{ border-top:1px solid rgba(255,255,255,0.06); }
  .stop .num{ width:34px; height:34px; border-radius:50%; flex:none; display:flex; align-items:center;
    justify-content:center; font-size:14px; font-weight:700; color:#fff; border:1.5px solid rgba(255,255,255,0.3); }
  .stop .num.start{ background:var(--green); border-color:var(--green); }
  .stop .num.done{ background:#2C2C2E; border-color:#2C2C2E; color:var(--muted); }
  .stop .info{ flex:1; min-width:0; }
  .stop .addr{ color:#fff; font-size:16px; font-weight:400; line-height:1.3; letter-spacing:-0.2px; display:flex; align-items:center; min-width:0; }
  .stop .addr .addr-txt{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stop .badge{ flex:none; }
  .stop .eta{ color:var(--muted); font-size:13px; font-weight:400; margin-top:2px; letter-spacing:-0.1px; }
  .stop .time{ color:#fff; font-size:16px; font-weight:600; margin-right:6px; letter-spacing:-0.2px; }
  .stop .chev{ color:var(--muted); font-size:16px; }

  /* barre de saisie (vue input) */
  .hint{ color:var(--muted); font-size:15px; line-height:1.35; margin-bottom:4px; }
  .input-bar{ display:flex; position:relative; margin-bottom:12px; }
  .input-bar input{ flex:1; background:rgba(255,255,255,0.06); backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%); border:1px solid rgba(255,255,255,0.12); outline:none;
    color:#fff; font-size:16px; padding:15px 58px 15px 20px; border-radius:100px; }
  .input-bar input::placeholder{ color:var(--muted); }
  .add-inline{ position:absolute; right:6px; top:50%; transform:translateY(-50%); width:40px; height:40px;
    border-radius:50%; border:none; background:var(--green); color:#04130a; display:flex; align-items:center;
    justify-content:center; transition:transform .12s ease; }
  .add-inline:active{ transform:translateY(-50%) scale(0.92); }
  .suggestions{ position:absolute; top:56px; left:0; right:0; background:#1C1C1E; border:1px solid rgba(255,255,255,0.1);
    border-radius:var(--rm); overflow:hidden; max-height:200px; overflow-y:auto; display:none; z-index:10; }
  .suggestions div{ padding:12px 14px; font-size:14px; color:#fff; border-bottom:1px solid rgba(255,255,255,0.06); }

  /* barre du bas fixe : bouton démarrer + ··· */
  .bottombar{ display:flex; gap:10px; padding:12px 20px calc(14px + env(safe-area-inset-bottom)); }
  .btn{ border:none; border-radius:16px; font-size:17px; font-weight:600; padding:16px; flex:1; letter-spacing:-0.2px;
    color:#000; background:#fff; display:flex; align-items:center; justify-content:center; gap:9px;
    transition:transform .12s ease, opacity .12s ease; }
  .btn:active{ transform:scale(0.97); }
  .btn.dark{ background:#1C1C1E; color:#fff; border:1px solid rgba(255,255,255,0.1); }
  .btn.green{ background:var(--green); color:#fff; }
  .btn.blue{ background:var(--blue); color:#fff; }
  .btn[disabled]{ opacity:0.35; }
  .btn.dots{ flex:none; width:64px; font-size:20px; }

  .stats{ display:none; }
  .nav-top{ position:absolute; top:14px; left:14px; right:14px; background:rgba(20,20,22,0.92);
    backdrop-filter:blur(10px); border-radius:18px; padding:14px 16px; display:flex; align-items:center;
    gap:14px; color:#fff; z-index:8; border:1px solid rgba(255,255,255,0.1); }
  .nav-top .turn{ color:var(--green); font-size:26px; }
  .nav-top .big{ font-size:16px; font-weight:600; }
  .nav-top .small{ color:var(--muted); font-size:13px; }

  /* ===== auth ===== */
  .overlay{ position:absolute; inset:0; z-index:50; background:#000; display:flex; align-items:center;
    justify-content:center; padding:24px; overflow:hidden; }
  .auth-card{ background:#0F0F12; border-radius:28px; padding:34px 26px 28px; width:100%; max-width:360px;
    box-shadow:0 24px 70px rgba(0,0,0,0.6); text-align:center; border:1px solid rgba(255,255,255,0.08); }
  .auth-card h1{ font-size:27px; font-weight:800; letter-spacing:-0.6px; margin:6px 0 6px; color:#fff; }
  .auth-card p{ color:var(--muted); font-size:15px; margin:0 0 26px; line-height:1.4; }
  .field{ position:relative; margin-bottom:12px; }
  .field-ico{ position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--muted);
    font-size:18px; display:flex; pointer-events:none; }
  .auth-card input{ width:100%; box-sizing:border-box; background:#1A1A1E; border:1px solid rgba(255,255,255,0.08);
    outline:none; font-size:16px; padding:15px 15px 15px 46px; border-radius:14px; color:#fff;
    transition:border-color .2s ease, background .2s ease; }
  .auth-card input:focus{ border-color:var(--blue); background:#1E1E24; }
  .auth-card input::placeholder{ color:var(--muted); }
  .auth-submit{ background:var(--blue); color:#fff; margin-top:6px; width:100%; border-radius:14px;
    font-size:16px; font-weight:700; padding:16px; box-shadow:0 8px 24px rgba(0,122,255,0.35); }
  .auth-switch{ margin-top:20px; font-size:14px; color:var(--muted); }
  .auth-switch a{ color:var(--blue); font-weight:600; text-decoration:none; }
  .auth-msg{ font-size:13px; margin-top:14px; min-height:16px; }
  .auth-msg.err{ color:#FF453A; } .auth-msg.ok{ color:var(--green); }
  .logo-box{ width:76px; height:76px; border-radius:22px; margin:0 auto 14px;
    background:linear-gradient(160deg,#1C1C22,#0C0C0F); border:1px solid rgba(255,255,255,0.1);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,0.55); }
  .logo-box img{ width:72%; height:72%; object-fit:contain; }

  /* ===== fond étoilé animé ===== */
  .starfield{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .starfield .star{ position:absolute; width:2px; height:2px; border-radius:50%; background:#fff;
    opacity:0.5; animation:twinkle 3s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:0.15; transform:scale(0.8); } 50%{ opacity:0.9; transform:scale(1.2); } }
  #app{ position:relative; z-index:1; }

  /* ===== écran de chargement : roue qui tourne ===== */
  .splash-screen{ position:fixed; inset:0; z-index:99999; background:#000;
    display:flex; align-items:center; justify-content:center; transition:opacity 0.45s ease-out; }
  .splash-screen.hide{ opacity:0; pointer-events:none; }
  .spinner{ width:44px; height:44px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.15); border-top-color:#fff;
    animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* badges statut */
  .badge{ font-size:11px; font-weight:600; padding:2px 8px; border-radius:8px; margin-left:6px; vertical-align:middle; }
  .badge.bdone{ background:rgba(52,199,89,0.2); color:#34C759; }
  .badge.bfail{ background:rgba(255,69,58,0.2); color:#FF453A; }
  .badge.blater{ background:rgba(255,159,10,0.2); color:#FF9F0A; }

  /* toggle retour au départ */
  .loop-toggle{ display:flex; align-items:center; justify-content:space-between; padding:4px 6px 0;
    color:#fff; font-size:15px; margin-bottom:6px; }
  .switch{ position:relative; display:inline-block; width:48px; height:28px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:#39393D; border-radius:28px; transition:.25s; }
  .slider:before{ content:""; position:absolute; width:24px; height:24px; left:2px; top:2px;
    background:#fff; border-radius:50%; transition:.25s; }
  .switch input:checked + .slider{ background:var(--green); }
  .switch input:checked + .slider:before{ transform:translateX(20px); }

  /* feuille d'un arrêt */
  .stop-sheet-ov{ position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.5);
    display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .2s ease; }
  .stop-sheet{ background:#1A1A1E; border-radius:24px 24px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    width:100%; max-width:430px; border-top:1px solid rgba(255,255,255,0.1); animation:sheetUp .3s cubic-bezier(.22,1,.36,1); }
  @keyframes sheetUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
  .ss-grab{ width:38px; height:5px; border-radius:3px; background:rgba(255,255,255,0.25); margin:0 auto 14px; }
  .ss-title{ color:#fff; font-size:17px; font-weight:600; margin-bottom:14px; }
  .ss-label{ display:block; color:var(--muted); font-size:13px; margin:0 0 6px; }
  .ss-note{ width:100%; box-sizing:border-box; background:#2C2C2E; border:1px solid rgba(255,255,255,0.1);
    outline:none; color:#fff; font-size:15px; padding:12px; border-radius:12px; min-height:60px; resize:none;
    margin-bottom:14px; font-family:inherit; }
  .ss-status{ display:flex; gap:8px; margin-bottom:16px; }
  .ss-status button{ flex:1; background:#2C2C2E; border:1px solid rgba(255,255,255,0.1); color:#fff;
    font-size:13px; font-weight:600; padding:11px 6px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; gap:4px; }
  .ss-status button.on{ background:var(--green); color:#04130a; border-color:var(--green); }
  .ss-save{ background:#fff; color:#000; }

  .import-btn{ width:100%; margin-top:10px; background:transparent; border:1px dashed rgba(255,255,255,0.2);
    color:var(--muted); font-size:14px; font-weight:500; padding:13px; border-radius:14px;
    display:flex; align-items:center; justify-content:center; gap:8px; }
  .import-btn:active{ background:rgba(255,255,255,0.04); }

  /* actions de ligne (réorganiser) */
  .row-actions{ display:flex; align-items:center; gap:2px; flex:none; }
  .row-actions .ra{ width:30px; height:30px; border:none; background:none; color:var(--muted);
    display:flex; align-items:center; justify-content:center; font-size:16px; border-radius:8px; }
  .row-actions .ra:active{ background:rgba(255,255,255,0.08); }
  .row-actions .ra[disabled]{ opacity:0.25; }
  .row-actions .ra.lock.on{ color:var(--green); }
  .row-actions .ra.del{ color:#FF6961; }

  /* sélecteur nombre de véhicules */
  .veh-select{ display:flex; align-items:center; justify-content:space-between; padding:4px 6px; color:#fff; font-size:15px; margin-bottom:8px; }
  .veh-opts{ display:flex; gap:6px; }
  .veh-opts button{ width:36px; height:36px; border-radius:10px; border:1px solid rgba(255,255,255,0.12);
    background:#1C1C1E; color:#fff; font-size:15px; font-weight:600; }
  .veh-opts button.on{ background:var(--green); color:#04130a; border-color:var(--green); }

  /* onglets véhicules */
  .veh-tabs{ display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .veh-tab{ flex:none; display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    background:#121214; border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:10px 14px;
    color:#fff; font-size:14px; font-weight:600; position:relative; }
  .veh-tab .vdot{ width:9px; height:9px; border-radius:50%; background:var(--vc); position:absolute; top:10px; right:12px; }
  .veh-tab .vsub{ color:var(--muted); font-size:11px; font-weight:400; }
  .veh-tab.on{ border-color:var(--vc); background:rgba(255,255,255,0.04); }

  .hidden{ display:none !important; }

  /* ===== ANIMATIONS D'ENTRÉE (style iOS) ===== */
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes scaleIn{ from{ opacity:0; transform:scale(0.94); } to{ opacity:1; transform:scale(1); } }
  @keyframes slideInRight{ from{ opacity:0; transform:translateX(22px); } to{ opacity:1; transform:translateX(0); } }
  @keyframes drawerUp{ from{ opacity:0; transform:translateY(34px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes popLogo{ 0%{ opacity:0; transform:scale(0.7); } 60%{ transform:scale(1.06); } 100%{ opacity:1; transform:scale(1); } }

  /* éléments animés au chargement */
  .topbar{ animation:fadeIn .5s ease both; }
  .sheet{ animation:scaleIn .55s cubic-bezier(.22,1,.36,1) both; }
  .drawer{ animation:drawerUp .55s cubic-bezier(.22,1,.36,1) .08s both; }

  /* carte d'auth */
  .auth-card{ animation:scaleIn .5s cubic-bezier(.22,1,.36,1) both; }
  .logo-box{ animation:popLogo .6s cubic-bezier(.22,1,.36,1) both; }
  .auth-card h1{ animation:fadeUp .5s ease .08s both; }
  .auth-card p{ animation:fadeUp .5s ease .14s both; }
  .field{ animation:fadeUp .5s ease both; }
  .field:nth-of-type(1){ animation-delay:.18s; }
  .field:nth-of-type(2){ animation-delay:.24s; }
  .auth-submit{ animation:fadeUp .5s ease .30s both; }
  .auth-switch{ animation:fadeUp .5s ease .36s both; }

  /* changement de vue dans le tiroir : la vue qui devient visible s'anime */
  .view-enter{ animation:slideInRight .42s cubic-bezier(.22,1,.36,1) both; }

  /* lignes de liste en cascade (classe ajoutée par JS) */
  .row-stagger{ animation:fadeUp .42s cubic-bezier(.22,1,.36,1) both; }

  /* bandeau navigation */
  .nav-top{ animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both; }

  @media (prefers-reduced-motion: reduce){
    .topbar,.scroll,.auth-card,.logo-box,.auth-card h1,.auth-card p,
    .field,.auth-submit,.auth-switch,.view-enter,.row-stagger,.nav-top{
      animation:none !important;
    }
  }
</style>
</head>
<body>
<div id="splashScreen" class="splash-screen">
  <div class="spinner"></div>
</div>
<div id="app">

  <!-- ===== AUTH (obligatoire) ===== -->
  <div class="overlay" id="authOverlay">
    <div class="auth-card" style="position:relative; z-index:2;">
      <div class="logo-box"><img id="authLogo" alt="MaTournée"></div>
      <h1>MaTournée</h1>
      <p id="authSub">Connectez-vous pour accéder à vos tournées.</p>
      <div class="field">
        <span class="field-ico"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
        <input id="authEmail" type="email" placeholder="Adresse e-mail" autocomplete="email">
      </div>
      <div class="field">
        <span class="field-ico"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></span>
        <input id="authPass" type="password" placeholder="Mot de passe" autocomplete="current-password">
      </div>
      <button class="btn auth-submit" id="authBtn">Se connecter</button>
      <div class="auth-switch" id="authSwitch">
        Pas encore de compte ? <a id="toSignup">Créer un compte</a>
      </div>
      <div class="auth-msg" id="authMsg"></div>
    </div>
  </div>

  <!-- ===== barre haut ===== -->
  <div class="topbar">
    <div class="brand">
      <img id="topLogo" alt="MaTournée" style="height:30px;width:auto;object-fit:contain;">
    </div>
    <button class="circle-btn" id="logoutBtn" aria-label="Se déconnecter"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/></svg></button>
  </div>

  <!-- ===== zone scrollable ===== -->

    <div class="greeting" id="greeting">Bonjour 👋</div>

    <div class="subtitle" id="subtitle">Ajoutez vos adresses pour commencer</div>

    <!-- stats (visible après optimisation) -->
    <div class="statbar" id="statbar">
      <div class="cell">
        <div class="ico"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
        <div><div class="k">Durée estimée</div><div class="v" id="rTime">0 min</div></div>
      </div>
      <div class="cell">
        <div class="ico"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
        <div><div class="k">Distance totale</div><div class="v" id="rDist">0 km</div></div>
      </div>
    </div>

    <!-- carte -->
    <div class="mapcard">
      <div id="mapPlaceholder"><div style="font-size:26px;"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></div><div>La carte s'affiche ici</div></div>
      <div id="gmap" class="hidden"></div>
      <button class="loc-btn hidden" id="locBtn"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 18-8-4-8 4z"/></svg></button>
      <div class="nav-top hidden" id="navTop">

        <div style="flex:1;"><div class="big" id="navInstr">Prochain arrêt</div><div class="small" id="navDetail">—</div></div>
        <div class="big" id="navDist">—</div>

    </div>

    <!-- VUE SAISIE : champ d'ajout -->
    <div id="viewInput">
      <div class="input-bar">

      <button class="import-btn" id="importBtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg> Importer une liste d'adresses</button>
    </div>

    <!-- onglets véhicules (multi-véhicules) -->
    <div class="veh-tabs hidden" id="vehTabs"></div>
    <!-- LISTE D'ARRÊTS (saisie + résultat) -->

  </div>

  <!-- ===== barre du bas ===== -->

  </div>

  <div class="bottombar hidden" id="bottomResult">
    <button class="btn" id="navBtn"><svg viewBox="0 0 24 24" width="1.2em" height="1.2em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 18-8-4-8 4z"/></svg> Démarrer la tournée</button>
    <button class="btn dots" id="shareBtn" aria-label="Partager"><svg viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg></button>

let authMode = "login"; // ou "signup"
function setAuthMode(m){
  authMode = m;
  const isLogin = m==="login";
  document.getElementById("authSub").textContent = isLogin
    ? "Connectez-vous pour accéder à vos tournées." : "Créez votre compte pour commencer.";
  document.getElementById("authBtn").textContent = isLogin ? "Se connecter" : "Créer mon compte";
  document.getElementById("authSwitch").innerHTML = isLogin
    ? 'Pas encore de compte ? <a id="toSignup">Créer un compte</a>'
    : 'Déjà inscrit ? <a id="toLogin">Se connecter</a>';
  wireSwitch();
}
function wireSwitch(){
  const su=document.getElementById("toSignup"), li=document.getElementById("toLogin");
  if(su) su.onclick=()=>setAuthMode("signup");
  if(li) li.onclick=()=>setAuthMode("login");

async function doAuth(){
  const email=document.getElementById("authEmail").value.trim();
  const pass=document.getElementById("authPass").value;
  const msg=document.getElementById("authMsg");
  msg.className="auth-msg";
  if(!email || !pass){ msg.textContent="Entrez votre e-mail et mot de passe."; msg.className="auth-msg err"; return; }
  if(!sb){ msg.textContent="Supabase non configuré (ajoutez la clé anon)."; msg.className="auth-msg err"; return; }
  msg.textContent="…";
  try{
    if(authMode==="signup"){
      const { data, error } = await sb.auth.signUp({ email, password:pass });
      if(error) throw error;
      if(data.user && !data.session){
        msg.textContent="Compte créé ✓ Vérifiez votre e-mail pour confirmer."; msg.className="auth-msg ok"; return;
      }
      onLogin(data.user);
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
      if(error) throw error;
      onLogin(data.user);
    }
  }catch(e){
    msg.textContent = traduireErreur(e.message); msg.className="auth-msg err";
  }
}
function traduireErreur(m){
  if(/Invalid login/i.test(m)) return "E-mail ou mot de passe incorrect.";
  if(/already registered/i.test(m)) return "Cet e-mail a déjà un compte.";
  if(/at least 6/i.test(m)) return "Le mot de passe doit faire 6 caractères minimum.";
  return m;
}

  state.user = user;

  const pretty = name ? name.charAt(0).toUpperCase()+name.slice(1) : "";
  document.getElementById("greeting").textContent = "Bonjour "+pretty+" 👋";

    let txt="🚚 Véhicule "+(state.activeVehicle+1)+" — MaTournée\n\n";

    txt += "\n⏱ "+document.getElementById("rTime").textContent+" · "+document.getElementById("rDist").textContent;
    const pts=rt.order.map(idx=>rt.stops[idx]).filter(s=>s.lat!=null);
    if(pts.length){ txt += "\n\n🗺 Itinéraire : https://www.google.com/maps/dir/"+pts.map(s=>s.lat+","+s.lng).join("/"); }
    if(navigator.share){ navigator.share({ title:"Tournée véhicule "+(state.activeVehicle+1), text:txt }).catch(()=>{}); }
    else { navigator.clipboard.writeText(txt).then(()=>toast("Tournée copiée ✓")).catch(()=>toast("Impossible de copier.")); }
    return;
  }
  const seq = state.ordered ? state.ordered.order : state.stops.map((_,i)=>i);
  if(!seq.length){ toast("Aucune tournée à partager."); return; }
  let txt="🚚 Ma tournée MaTournée\n\n";
  seq.forEach((idx,i)=>{
    const s=state.stops[idx];
    txt += (i+1)+". "+s.name + (s.note?(" — "+s.note):"") + "\n";
  });
  if(state.ordered){
    txt += "\n⏱ "+document.getElementById("rTime").textContent+" · "+document.getElementById("rDist").textContent;
  }
  // lien Google Maps avec les arrêts
  const pts=seq.map(idx=>state.stops[idx]).filter(s=>s.lat!=null);
  if(pts.length){
    const wp=pts.map(s=>s.lat+","+s.lng).join("/");
    txt += "\n\n🗺 Itinéraire : https://www.google.com/maps/dir/"+wp;
  }
  if(navigator.share){
    navigator.share({ title:"Ma tournée", text:txt }).catch(()=>{});

    navigator.clipboard.writeText(txt).then(()=>toast("Tournée copiée ✓ Collez-la où vous voulez."))

function pushStop(name,lat,lng){

function renderAddrList(){

  const el=document.getElementById("stoplist"); el.innerHTML="";

  state.stops.forEach((s,i)=>{

      <div class="row-actions">
        <button class="ra up" data-i="${i}" aria-label="Monter" ${i===0?'disabled':''}>${ic('chevup')}</button>

function moveStop(i,dir){
  const j=i+dir;
  if(j<0 || j>=state.stops.length) return;
  const tmp=state.stops[i]; state.stops[i]=state.stops[j]; state.stops[j]=tmp;
  state.ordered=null;
  renderAddrList(); fitMarkers();
}
function toggleLock(id){
  const s=state.stops.find(x=>x.id===id);
  if(s){ s.locked=!s.locked; state.ordered=null; renderAddrList(); }
}

function fitMarkers(){
  if(!state.mapsReady) return;
  markers.forEach(m=>m.setMap(null)); markers=[];
  // ordre : optimisé si dispo, sinon ordre de saisie
  const seq = state.ordered ? state.ordered.order : state.stops.map((_,i)=>i);
  const bounds=new google.maps.LatLngBounds();
  let shown=0;
  seq.forEach((idx,pos)=>{
    const s=state.stops[idx];
    if(!s || s.lat==null) return;
    const isStart = pos===0;
    const mk=new google.maps.Marker({ position:{lat:s.lat,lng:s.lng}, map:gmap, zIndex:10,
      label:{ text:String(pos+1), color:isStart?"#fff":"#111", fontWeight:"700", fontSize:"12px" },
      icon:{ path:google.maps.SymbolPath.CIRCLE, scale:13,
        fillColor:isStart?"#34C759":"#FFFFFF", fillOpacity:1, strokeColor:isStart?"#34C759":"#FFFFFF", strokeWeight:0 }});
    markers.push(mk); bounds.extend(mk.getPosition()); shown++;
  });
  if(shown) gmap.fitBounds(bounds, 50);
}

/* ================= OPTIMISATION ================= */
function runOptimize(){
  if(!state.mapsReady || !dirService){ toast("Ajoutez la clé Google Maps pour optimiser."); return; }
  const geocoded=state.stops.filter(s=>s.lat!=null);
  if(geocoded.length<2){ toast("Ajoutez au moins 2 adresses valides."); return; }
  if(state.nbVehicles>1){ optimizeMulti(); return; }
  state.routes=null;
  const loop = state.returnToStart;
  const hasLocks = state.stops.some(s=>s.locked);
  const origin={lat:state.stops[0].lat,lng:state.stops[0].lng};
  // si boucle : destination = départ, et tous les autres sont des waypoints
  // sinon : destination = dernier arrêt
  const dest = loop ? origin : {lat:state.stops[state.stops.length-1].lat,lng:state.stops[state.stops.length-1].lng};
  const middle = loop ? state.stops.slice(1) : state.stops.slice(1,-1);
  const waypoints = middle.filter(s=>s.lat!=null).map(s=>({location:{lat:s.lat,lng:s.lng},stopover:true}));
  // si des arrêts sont verrouillés, on garde l'ordre manuel (pas d'optimisation auto)
  dirService.route({ origin, destination:dest, waypoints, optimizeWaypoints:!hasLocks,
    travelMode:google.maps.TravelMode.DRIVING },(result,status)=>{
    if(status!=="OK"){ toast("Itinéraire impossible : "+status); return; }
    dirRenderer.setDirections(result);
    const r=result.routes[0];
    let m=0,sec=0; const legSecs=[]; r.legs.forEach(l=>{ m+=l.distance.value; sec+=l.duration.value; legSecs.push(l.duration.value); });
    // ordre des arrêts (indices dans state.stops)
    let order;
    if(loop){
      order=[0].concat(r.waypoint_order.map(i=>i+1));
    } else {
      order=[0].concat(r.waypoint_order.map(i=>i+1)).concat([state.stops.length-1]);
    }
    state.ordered={ order, result, dist:m, time:sec, legSecs, loop };
    const h=Math.floor(sec/3600), min=Math.round((sec%3600)/60);
    document.getElementById("rTime").textContent = h>0 ? (h+"h "+min+"min") : (min+" min");
    document.getElementById("rDist").textContent=(m/1000).toFixed(1).replace(".",",")+" km";
    document.getElementById("subtitle").textContent=state.stops.length+" arrêts • Optimisé pour le plus rapide";
    renderResultList();
    fitMarkers();
    saveTour();
    showMode("result");
  });
}

/* ===== MULTI-VÉHICULES ===== */
const VEH_COLORS = ["#34C759","#0A84FF","#FF9F0A","#FF375F"];
function dist2(a,b){ return Math.hypot(a.lat-b.lat, a.lng-b.lng); }

/* répartit les arrêts (hors départ) entre N véhicules par proximité géographique (k-means simple) */
function clusterStops(){
  const start=state.stops[0];
  const pts=state.stops.slice(1).filter(s=>s.lat!=null);
  const K=Math.min(state.nbVehicles, pts.length);
  // init : centres = points les plus éloignés les uns des autres
  let centers=[pts[0]];
  while(centers.length<K){
    let best=null,bd=-1;
    pts.forEach(p=>{ const d=Math.min(...centers.map(c=>dist2(p,c))); if(d>bd){bd=d;best=p;} });
    centers.push(best);
  }
  centers=centers.map(c=>({lat:c.lat,lng:c.lng}));
  let clusters;
  for(let iter=0; iter<10; iter++){
    clusters=Array.from({length:K},()=>[]);
    pts.forEach(p=>{
      let bi=0,bd=Infinity;
      centers.forEach((c,ci)=>{ const d=dist2(p,c); if(d<bd){bd=d;bi=ci;} });
      clusters[bi].push(p);
    });
    centers=clusters.map(cl=>{
      if(!cl.length) return centers[0];
      return { lat:cl.reduce((s,p)=>s+p.lat,0)/cl.length, lng:cl.reduce((s,p)=>s+p.lng,0)/cl.length };
    });
  }
  // chaque cluster = [départ] + ses arrêts
  return clusters.map(cl=>[start].concat(cl));
}

function optimizeMulti(){
  const clusters=clusterStops();
  state.routes=[]; state.activeVehicle=0;
  let pending=clusters.length;
  const loop=state.returnToStart;
  clusters.forEach((groupStops, vi)=>{
    if(groupStops.length<2){
      state.routes[vi]={ stops:groupStops, order:groupStops.map((_,i)=>i), dist:0, time:0, legSecs:[], loop, result:null };
      if(--pending===0) finishMulti();
      return;
    }
    const origin={lat:groupStops[0].lat,lng:groupStops[0].lng};
    const dest= loop ? origin : {lat:groupStops[groupStops.length-1].lat,lng:groupStops[groupStops.length-1].lng};
    const mid= loop ? groupStops.slice(1) : groupStops.slice(1,-1);
    const wp=mid.map(s=>({location:{lat:s.lat,lng:s.lng},stopover:true}));
    dirService.route({ origin, destination:dest, waypoints:wp, optimizeWaypoints:true,
      travelMode:google.maps.TravelMode.DRIVING },(res,st)=>{
      if(st==="OK"){
        const r=res.routes[0]; let m=0,sec=0; const legSecs=[];
        r.legs.forEach(l=>{ m+=l.distance.value; sec+=l.duration.value; legSecs.push(l.duration.value); });
        let order = loop ? [0].concat(r.waypoint_order.map(i=>i+1))
                         : [0].concat(r.waypoint_order.map(i=>i+1)).concat([groupStops.length-1]);
        state.routes[vi]={ stops:groupStops, order, dist:m, time:sec, legSecs, loop, result:res };
      } else {
        state.routes[vi]={ stops:groupStops, order:groupStops.map((_,i)=>i), dist:0, time:0, legSecs:[], loop, result:null };
      }
      if(--pending===0) finishMulti();
    });
  });
}

function finishMulti(){
  renderVehTabs();
  selectVehicle(0);
  saveTour();
  showMode("result");
}

function renderVehTabs(){
  const el=document.getElementById("vehTabs");
  if(!state.routes || state.routes.length<2){ el.classList.add("hidden"); return; }
  el.classList.remove("hidden"); el.innerHTML="";
  state.routes.forEach((rt,i)=>{
    const b=document.createElement("button");
    b.className="veh-tab"+(i===state.activeVehicle?" on":"");
    b.style.setProperty("--vc", VEH_COLORS[i%VEH_COLORS.length]);
    const nStops=rt.stops.length-1;
    b.innerHTML=`<span class="vdot"></span>Véhicule ${i+1}<span class="vsub">${nStops} arrêts</span>`;
    b.onclick=()=>selectVehicle(i);
    el.appendChild(b);
  });
}

function selectVehicle(i){
  state.activeVehicle=i;
  const rt=state.routes[i];
  // adapter l'affichage : on réutilise renderResultList via une vue "active"
  const h=Math.floor(rt.time/3600), min=Math.round((rt.time%3600)/60);
  document.getElementById("rTime").textContent = h>0 ? (h+"h "+min+"min") : (min+" min");
  document.getElementById("rDist").textContent=(rt.dist/1000).toFixed(1).replace(".",",")+" km";
  document.getElementById("subtitle").textContent="Véhicule "+(i+1)+" • "+(rt.stops.length-1)+" arrêts";
  renderVehTabs();
  renderMultiList(rt, i);
  // tracer sur la carte
  if(rt.result && dirRenderer){
    dirRenderer.setOptions({ polylineOptions:{ strokeColor:VEH_COLORS[i%VEH_COLORS.length], strokeWeight:4 }});
    dirRenderer.setDirections(rt.result);
  }
  fitMultiMarkers(rt, i);
}

function renderMultiList(rt, vi){
  const el=document.getElementById("stoplist"); el.innerHTML=""; el.style.display="block";
  // ETA pour ce véhicule
  let t=new Date(); const etas=[];
  rt.order.forEach((idx,k)=>{ if(k>0) t=new Date(t.getTime()+(rt.legSecs[k-1]||0)*1000);
    etas.push(t.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})); });
  rt.order.forEach((idx,k)=>{
    const s=rt.stops[idx];
    const row=document.createElement("div"); row.className="stop"; row.style.cursor="pointer";
    const note = s.note ? `<div class="eta">📝 ${escapeHtml(s.note)}</div>` : "";
    const isStart=k===0;
    row.innerHTML=`<span class="num ${isStart?'start':''}" style="${isStart?'':'border-color:'+VEH_COLORS[vi%VEH_COLORS.length]}">${isStart?ic('flag'):(k+1)}</span>
      <div class="info"><div class="addr"><span class="addr-txt">${escapeHtml(s.name)}</span> ${statusBadge(s.status)}</div><div class="eta">ETA ${etas[k]}</div>${note}</div>
      <span class="time">${etas[k]}</span><span class="chev">›</span>`;
    row.onclick=()=>openStopSheetMulti(vi, idx);
    el.appendChild(row);
  });
  if(rt.loop){
    const s=rt.stops[0];
    const row=document.createElement("div"); row.className="stop";
    row.innerHTML=`<span class="num start">${ic('flag')}</span><div class="info"><div class="addr">Retour — ${escapeHtml(s.name)}</div><div class="eta">Fin</div></div>`;
    el.appendChild(row);
  }
  staggerRows(el);
}

function openStopSheetMulti(vi, idx){
  const s=state.routes[vi].stops[idx];
  // réutilise la même feuille mais sur l'objet du véhicule
  const realStop = state.stops.find(x=>x.id===s.id) || s;
  openStopSheetObj(realStop, ()=>selectVehicle(state.activeVehicle));
}

function fitMultiMarkers(rt, vi){
  if(!state.mapsReady) return;
  markers.forEach(m=>m.setMap(null)); markers=[];
  const bounds=new google.maps.LatLngBounds();
  rt.order.forEach((idx,k)=>{
    const s=rt.stops[idx]; if(s.lat==null) return;
    const isStart=k===0;
    const mk=new google.maps.Marker({ position:{lat:s.lat,lng:s.lng}, map:gmap, zIndex:10,
      label:{ text:String(k+1), color:"#fff", fontWeight:"700", fontSize:"12px" },
      icon:{ path:google.maps.SymbolPath.CIRCLE, scale:13,
        fillColor:isStart?"#34C759":VEH_COLORS[vi%VEH_COLORS.length], fillOpacity:1, strokeColor:"#fff", strokeWeight:1.5 }});
    markers.push(mk); bounds.extend(mk.getPosition());
  });
  if(markers.length) gmap.fitBounds(bounds,50);
}

/* calcule les ETA à partir de l'heure de départ + durées de trajet */
function computeETAs(){
  const etas=[]; let t=new Date(); // départ = maintenant
  for(let i=0;i<state.ordered.order.length;i++){
    if(i>0 && state.ordered.legSecs){ t=new Date(t.getTime()+state.ordered.legSecs[i-1]*1000); }
    etas.push(t.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}));
  }
  return etas;
}

function statusBadge(st){
  if(st==="done") return '<span class="badge bdone">Livré</span>';
  if(st==="fail") return '<span class="badge bfail">Échec</span>';
  if(st==="later") return '<span class="badge blater">Reporté</span>';
  return '';
}
function renderResultList(){
  const el=document.getElementById("stoplist"); el.innerHTML=""; el.style.display="block";
  const etas=computeETAs();
  state.ordered.order.forEach((idx,i)=>{
    const s=state.stops[idx];
    const navDone=i<state.navIndex;
    const row=document.createElement("div"); row.className="stop"; row.style.cursor="pointer";
    const note = s.note ? `<div class="eta" style="color:#8E8E93;">📝 ${escapeHtml(s.note)}</div>` : "";
    row.innerHTML=`<span class="num ${i===0&&state.navIndex===0?'start':''} ${navDone?'done':''}">${navDone?ic('check'):(i+1)}</span>
      <div class="info"><div class="addr"><span class="addr-txt">${escapeHtml(s.name)}</span> ${statusBadge(s.status)}</div><div class="eta">ETA ${etas[i]}</div>${note}</div>
      <span class="time">${etas[i]}</span><span class="chev">›</span>`;
    row.onclick=()=>openStopSheet(idx);
    el.appendChild(row);
  });
  // ligne retour au départ si boucle
  if(state.ordered.loop){
    const s=state.stops[0];
    const row=document.createElement("div"); row.className="stop";
    row.innerHTML=`<span class="num start">${ic('flag')}</span>
      <div class="info"><div class="addr">Retour — ${escapeHtml(s.name)}</div><div class="eta">Fin de tournée</div></div>`;
    el.appendChild(row);
  }
  staggerRows(el);
}

/* feuille d'un arrêt : note + statut */
function openStopSheet(idx){
  openStopSheetObj(state.stops[idx], ()=>{ if(state.ordered) renderResultList(); else renderAddrList(); });
}
function openStopSheetObj(s, onSave){
  const ov=document.createElement("div"); ov.className="stop-sheet-ov";
  ov.innerHTML=`
    <div class="stop-sheet" onclick="event.stopPropagation()">
      <div class="ss-grab"></div>
      <div class="ss-title">${escapeHtml(s.name)}</div>
      <label class="ss-label">Note</label>
      <textarea class="ss-note" id="ssNote" placeholder="Code portail, étage, instructions…">${escapeHtml(s.note||"")}</textarea>
      <label class="ss-label">Statut</label>
      <div class="ss-status">
        <button data-st="done" class="${s.status==='done'?'on':''}">${ic('check')} Livré</button>
        <button data-st="fail" class="${s.status==='fail'?'on':''}">Échec</button>
        <button data-st="later" class="${s.status==='later'?'on':''}">Reporté</button>
      </div>
      <button class="btn ss-save" id="ssSave">Enregistrer</button>
    </div>`;
  ov.onclick=()=>ov.remove();
  document.getElementById("app").appendChild(ov);
  let chosen=s.status||"";
  ov.querySelectorAll(".ss-status button").forEach(b=>{
    b.onclick=()=>{ chosen = (chosen===b.dataset.st)?"":b.dataset.st;
      ov.querySelectorAll(".ss-status button").forEach(x=>x.classList.remove("on"));
      if(chosen) b.classList.add("on"); };
  });
  ov.querySelector("#ssSave").onclick=()=>{
    s.note=ov.querySelector("#ssNote").value.trim();
    s.status=chosen;
    ov.remove();
    if(onSave) onSave();
    saveTour();
  };
}

/* ================= NAVIGATION IN-APP ================= */
function startNav(){
  if(!state.ordered) return;
  state.navIndex=0;
  showMode("nav");
  document.getElementById("navTop").classList.remove("hidden");
  startLocationWatch();
  renderResultList();
  updateNavTarget();
}
function updateNavTarget(){
  document.getElementById("nLeftWrap") && null;
  if(state.navIndex>=state.ordered.order.length){
    document.getElementById("navInstr").textContent="Tournée terminée";
    document.getElementById("navDetail").textContent="Tous les arrêts sont livrés";
    document.getElementById("navDist").textContent="";
    return;
  }
  const idx=state.ordered.order[state.navIndex];
  const s=state.stops[idx];
  document.getElementById("navInstr").textContent="Arrêt "+(state.navIndex+1);
  document.getElementById("navDetail").textContent=s.name;
  if(meMarker){
    dirService.route({ origin:meMarker.getPosition(), destination:{lat:s.lat,lng:s.lng},
      travelMode:google.maps.TravelMode.DRIVING },(res,st)=>{
      if(st==="OK"){ dirRenderer.setDirections(res);
        const leg=res.routes[0].legs[0];
        document.getElementById("navDist").textContent=leg.distance.text;
        document.getElementById("navDetail").textContent=s.name+" · "+leg.duration.text;
      }
    });
  } else if(gmap){ gmap.panTo({lat:s.lat,lng:s.lng}); gmap.setZoom(15); }
}
function nextStop(){
  state.navIndex++;
  renderResultList();
  if(state.navIndex>=state.ordered.order.length){ toast("Tournée terminée ✓"); }
  updateNavTarget();
}
function stopNav(){
  stopLocationWatch();
  document.getElementById("navTop").classList.add("hidden");
  if(state.ordered) dirRenderer.setDirections(state.ordered.result);
  showMode("result");
}

/* ===== position GPS en direct ===== */
function startLocationWatch(){
  if(!navigator.geolocation) return;
  watchId=navigator.geolocation.watchPosition(pos=>{
    const p={lat:pos.coords.latitude,lng:pos.coords.longitude};
    if(!meMarker){
      meMarker=new google.maps.Marker({ position:p, map:gmap, zIndex:999,
        icon:{ path:google.maps.SymbolPath.CIRCLE, scale:8, fillColor:"#007AFF", fillOpacity:1,
          strokeColor:"#fff", strokeWeight:3 }});
    } else meMarker.setPosition(p);
  }, err=>{ console.warn(err); }, { enableHighAccuracy:true, maximumAge:2000 });
}
function stopLocationWatch(){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }
function centerOnMe(){
  if(meMarker){ gmap.panTo(meMarker.getPosition()); gmap.setZoom(15); }
  else if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{ gmap.panTo({lat:pos.coords.latitude,lng:pos.coords.longitude}); gmap.setZoom(15); });
  }
}

/* ================= MODES / VUES ================= */
function showMode(m){
  // m = 'input' | 'result' | 'nav' | 'hist'
  const scroll=document.getElementById("scroll");
  scroll.classList.remove("view-enter"); void scroll.offsetWidth; scroll.classList.add("view-enter");
  // stats visibles partout sauf en historique
  document.getElementById("statbar").classList.toggle("hidden", m==="hist");
  // bloc saisie (champ d'ajout) visible seulement en input
  document.getElementById("viewInput").classList.toggle("hidden", m!=="input");
  // historique
  document.getElementById("viewHist").classList.toggle("hidden", m!=="hist");
  document.getElementById("stoplist").classList.toggle("hidden", m==="hist");
  // barres du bas
  document.getElementById("bottomInput").classList.toggle("hidden", m!=="input");
  document.getElementById("bottomResult").classList.toggle("hidden", m!=="result");
  document.getElementById("bottomNav").classList.toggle("hidden", m!=="nav");
  // onglets véhicules : visibles seulement en résultat multi-véhicules
  const vehTabs=document.getElementById("vehTabs");
  if(m==="result" && state.routes && state.routes.length>1){ vehTabs.classList.remove("hidden"); }
  else { vehTabs.classList.add("hidden"); }
  // en mode saisie : stats à 0 tant que pas optimisé
  if(m==="input"){
    if(!state.ordered && !state.routes){
      document.getElementById("rTime").textContent = "0 min";
      document.getElementById("rDist").textContent = "0 km";
    }
    document.getElementById("subtitle").textContent = state.stops.length? (state.stops.length+" adresses ajoutées") : "Ajoutez vos adresses pour commencer";
    renderAddrList();
  }
  state.mode_view=m;
}
/* cascade des lignes */
function staggerRows(container){
  const rows = container.querySelectorAll(".stop");
  rows.forEach((r,i)=>{
    r.classList.remove("row-stagger"); void r.offsetWidth;
    r.style.animationDelay = (i*0.04)+"s"; r.classList.add("row-stagger");
  });
}

/* ================= UTILS ================= */
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg){
  const t=document.createElement("div"); t.textContent=msg;
  t.style.cssText="position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(28,28,30,0.95);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:99;max-width:80%;text-align:center;";
  document.getElementById("app").appendChild(t); setTimeout(()=>t.remove(),2200);
}

document.getElementById("authPass").addEventListener("keydown",e=>{ if(e.key==="Enter") doAuth(); });
document.getElementById("logoutBtn").onclick=logout;

  b.onclick=()=>{
    state.nbVehicles=+b.dataset.n;

document.getElementById("shareBtn").onclick=shareTour;

document.getElementById("optBtn").onclick=runOptimize;

document.getElementById("editBtn").onclick=()=>showMode("input");
